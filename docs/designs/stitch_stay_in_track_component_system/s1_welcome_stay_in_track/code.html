<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>S1 Welcome - STAY IN TRACK</title>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              navy: '#1F3A5F',
              teal: '#0F766E',
              bg: '#F5F7FA',
              card: '#FFFFFF',
              text: '#111827',
              secondary: '#4B5563',
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    /* Focus styles adhering to design tokens */
    a:focus-visible, button:focus-visible {
      outline: 2px solid #0F766E;
      outline-offset: 2px;
    }
  </style>
</head>
<body class="bg-[#F5F7FA] text-[#111827] font-sans antialiased min-h-screen flex items-center justify-center p-0 m-0">

  <!-- Mobile Phone Screen Container (390px wide, min-h-screen) -->
  <main class="w-full max-w-[390px] min-h-screen bg-[#F5F7FA] flex flex-col justify-between px-4 py-12 sm:my-6 sm:min-h-[844px] sm:shadow-lg sm:rounded-[24px] sm:border sm:border-slate-200">
    
    <!-- Top Spacer / Subdued Context Marker -->
    <div class="pt-6"></div>

    <!-- Center Section: Brand & Value Pitch -->
    <div class="flex flex-col items-center text-center px-2 space-y-8 my-auto">
      
      <!-- 1. Logo Wordmark: Check mark inside rounded square + "STAY IN TRACK" -->
      <div class="inline-flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-[#1F3A5F] flex items-center justify-center text-white shadow-sm flex-shrink-0" aria-hidden="true">
          <svg class="w-6 h-6 stroke-[2.5]" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </div>
        <span class="text-[22px] font-bold tracking-tight text-[#1F3A5F]">
          STAY IN TRACK
        </span>
      </div>

      <!-- 2. Pitch Text: "Know who has paid. Every time." -->
      <div class="space-y-2 max-w-[320px]">
        <h1 class="text-[26px] sm:text-[28px] font-bold leading-tight tracking-tight text-[#111827]">
          Know who has paid.<br>Every time.
        </h1>
        <p class="text-[15px] font-normal leading-relaxed text-[#4B5563]">
          Simple, reliable gym membership payment tracking for South African fitness clubs.
        </p>
      </div>

    </div>

    <!-- Bottom Action Section: 16px side margins (px-4), 8px grid gaps, 48px buttons -->
    <div class="w-full space-y-3 pb-6">
      
      <!-- 3. Primary Button: "Create account" (goes to S2 Sign Up) -->
      <a href="#s2-signup"
         class="w-full h-12 min-h-[48px] px-6 rounded-lg bg-[#1F3A5F] text-white font-semibold text-[16px] inline-flex items-center justify-center text-center transition-colors duration-150 hover:bg-[#162a45] active:bg-[#101f33] shadow-sm select-none">
        Create account
      </a>

      <!-- 4. Secondary (Outlined) Button: "Log in" (goes to S3 Log In) -->
      <a href="#s3-login"
         class="w-full h-12 min-h-[48px] px-6 rounded-lg bg-transparent border border-[#1F3A5F] text-[#1F3A5F] font-semibold text-[16px] inline-flex items-center justify-center text-center transition-colors duration-150 hover:bg-[#1F3A5F]/5 active:bg-[#1F3A5F]/10 select-none">
        Log in
      </a>

      <!-- Front-desk tone footnote / subtle info -->
      <p class="text-[13px] text-[#4B5563] text-center pt-2">
        South African gym payment & fee tracking
      </p>

    </div>

  </main>

</body>
</html>
